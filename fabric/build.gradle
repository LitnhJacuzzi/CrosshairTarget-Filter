plugins {
	id 'fabric-loom' version "1.8+"
}

base {
	archivesName = "${mod_id}-${mod_version}-fabric+1.17-1.21.11"
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	implementation project(':common')
}

loom {
	mixin {
		useLegacyMixinAp = false
	}
}

sourceSets {
	shadow {
		java {
			srcDir 'src/shadow/java'
		}
		compileClasspath += sourceSets.main.compileClasspath
	}
	
	main {
		compileClasspath = files(sourceSets.shadow.output) + compileClasspath
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from project(":common").sourceSets.main.output
}

tasks.register('buildUnremapped', Jar) {
	group = 'build'
	archiveBaseName = "${mod_id}-${mod_version}-fabric-26.1+"
	from sourceSets.main.output
	from project(":common").sourceSets.main.output
	System.setProperty("fabric.loom.dontRemap", "true")
}

artifacts {
    archives buildUnremapped
}

