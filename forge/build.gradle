plugins {
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7+'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
	mappings channel: mapping_channel, version: mapping_version
	copyIdeResources = true
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
	minecraft fg.deobf("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
	
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	
	implementation project(':common')
}

mixin {
	disableTargetValidator = true
	overwriteErrorLevel = 'warn'
	add sourceSets.main, 'crosshairtargetfilter.mixins.refmap.json'
	config 'crosshairtargetfilter.mixins.json'
}

sourceSets {
	shadow {
		java {
			srcDir 'src/shadow/java'
		}
		compileClasspath += sourceSets.main.compileClasspath
	}
	
	main {
		compileClasspath = files(sourceSets.shadow.output) + compileClasspath
	}
}

java {
	withSourcesJar()
	
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

project.jar {
	archiveFileName = "${rootProject.name}-${mod_version}-forge+1.17-1.20.4.jar"
	from (project(":common").sourceSets.main.output) {
		 exclude '**/mixin/*.class'
		 exclude 'crosshairtargetfilter.mixins.json'
	}
	
	manifest {
		attributes([
			"MixinConfigs": "crosshairtargetfilter.mixins.json",
			"Specification-Title"		: mod_id,
			"Specification-Vendor"		: author,
			"Specification-Version"		: "1",
			"Implementation-Title"		: rootProject.name,
			"Implementation-Version"	: mod_version,
			"Implementation-Vendor"		: author,
			"Implementation-Timestamp"	: new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}
